name: Reader foundation

on:
  push:
    branches: ["codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-reader:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . packaging
      - run: python -m unittest discover -s tests -p test_platform_imports.py -v
      - run: python -m unittest discover -s tests -p test_package_metadata.py -v
      - run: python -m unittest discover -s tests -p 'test_linux*.py' -v
      - run: python -m unittest discover -s tests -p test_media_file_identity.py -v

  windows-pure:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install . packaging
      - run: python -m unittest discover -s tests -p test_pure.py -v
      - run: python -m unittest discover -s tests -p test_package_metadata.py -v
