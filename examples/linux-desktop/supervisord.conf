[unix_http_server]
file=/tmp/wechat-desktop/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
umask=0077
pidfile=/tmp/wechat-desktop/supervisord.pid
logfile=/home/wechat/.local/state/wechat-desktop/supervisor.log
logfile_maxbytes=2MB
logfile_backups=2
childlogdir=/home/wechat/.local/state/wechat-desktop

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/wechat-desktop/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -auth /tmp/wechat-desktop/Xauthority -nolisten tcp
priority=10
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/wechat/.local/state/wechat-desktop/xvfb.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:window_manager]
command=/usr/bin/python3 /opt/wechat-desktop/desktop.py wait-display /usr/bin/openbox --sm-disable
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/wechat/.local/state/wechat-desktop/openbox.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:vnc]
command=/usr/bin/python3 /opt/wechat-desktop/desktop.py wait-display /usr/bin/x11vnc -display :99 -auth /tmp/wechat-desktop/Xauthority -localhost -rfbport 5900 -passwdfile /run/secrets/desktop_password -forever -shared -nolookup
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/wechat/.local/state/wechat-desktop/vnc.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:web]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/wechat/.local/state/wechat-desktop/web.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:wechat]
command=/usr/bin/python3 /opt/wechat-desktop/desktop.py wait-display /usr/bin/wechat
priority=50
autorestart=unexpected
startsecs=3
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/home/wechat/.local/state/wechat-desktop/wechat.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
