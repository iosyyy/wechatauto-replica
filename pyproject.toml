[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatauto-replica"
version = "1.2.10+iosyyy.linux.1"
description = "微信 4.x Windows 自动化与 Linux 读取基础：显式账号和已提供密钥下的 SQLCipher 数据库读取"
readme = "README_pypi.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "wechatauto-replica" }]
keywords = ["wechat", "weixin", "wechat4", "wxauto", "wechatauto", "uiautomation", "sqlcipher", "ocr", "rpa", "automation", "wechat-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "uiautomation>=2.0.18; sys_platform == 'win32'",
    "pywin32>=305; sys_platform == 'win32'",
    "pyperclip>=1.8.2",
    "Pillow>=9.0.0",
    "psutil>=5.9.0",
    "colorama>=0.4.6",
    "cryptography>=41.0.0",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
    "imageio-ffmpeg>=0.4.9; sys_platform == 'win32'",
    "zstandard>=0.19.0",
    "pyautogui>=0.9.53; sys_platform == 'win32'",
    "opencv-python>=4.8.0; sys_platform == 'win32'",
]

[project.scripts]
# 装完就能直接敲 `wechatauto 消息 文件传输助手`，不用记 python -m（issue #31）
wechatauto = "wechatauto.cli:main"

[project.optional-dependencies]
moments = ["pyautogui>=0.9.53", "opencv-python>=4.8.0"]
guia = ["winsdk>=1.0.0b10; sys_platform == 'win32'", "pypinyin>=0.48.0"]

[project.urls]
Homepage = "https://github.com/iosyyy/wechatauto-replica"
Repository = "https://github.com/iosyyy/wechatauto-replica"
Issues = "https://github.com/iosyyy/wechatauto-replica/issues"

[tool.setuptools.packages.find]
include = ["wechatauto*"]

[tool.setuptools.package-data]
wechatauto = ["py.typed"]
"wechatauto.assets" = ["*.png"]
